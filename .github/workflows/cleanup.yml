name: Remove old release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete v1.0.43 -R ${{ github.repository }} -y --cleanup-tag
